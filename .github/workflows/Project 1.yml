name: Project 1 | CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./Project 1

      - name: Install dependencies
        run: npm ci
        working-directory: ./Project 1

      - name: Run tests
        run: npm test
        working-directory: ./Project 1
        env:
          MONGODB_URI: mongodb://localhost:27017/edtech_analytics_test

      - name: Seed database and run additional checks
        run: |
          npm run seed
          npm run setup-rbac
        working-directory: ./Project 1
        env:
          MONGODB_URI: mongodb://localhost:27017/edtech_analytics

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t edtech-analytics ./Project 1

      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 3000:3000 edtech-analytics
          sleep 10
          curl -f http://localhost:3000/health || exit 1
          docker stop test-app
